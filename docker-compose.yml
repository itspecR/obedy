services:
  app:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      args:
        APP_RELEASE: "${APP_RELEASE:-}"
    env_file: .env
    network_mode: host
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - /etc/os-release:/host/os-release:ro
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    network_mode: host
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - /etc/obedy/tls:/etc/nginx/tls:ro
    logging: *logging
