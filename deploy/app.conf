root /usr/share/nginx/html;
client_max_body_size 1m;
include /etc/nginx/snippets/limits.conf;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;

auth_request /_access_check;
error_page 403 /forbidden.html;

location = /_access_check {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:8000/api/access/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /forbidden.html {
    internal;
    auth_request off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location = /forbidden.css {
    auth_request off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/api/auth/(login|change-password)$ {
    limit_req zone=login burst=100 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many_logins;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location @too_many_logins {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 429 '{"detail":"Слишком много попыток входа. Подождите минуту и попробуйте снова"}';
}

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
